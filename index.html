<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex,nofollow">
<title>লগইন — TukTak24 হিসাব</title>
<style>
:root{color-scheme:light;--ink:#171717;--muted:#6b7280;--line:#e5e7eb;--orange:#f56512}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink);background:linear-gradient(135deg,#111827 0%,#252525 55%,#8a350c 100%);display:grid;place-items:center;padding:20px}
.card{width:min(100%,420px);background:#fff;border:1px solid #ffffff55;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0005}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.mark{width:44px;height:44px;display:grid;place-items:center;background:var(--orange);color:#fff;border-radius:13px;font-size:24px;font-weight:900}
.brand strong{font-size:22px;letter-spacing:-.5px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
h1{font-size:23px;margin:0 0 7px}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;font:inherit;outline:none}
input:focus{border-color:var(--orange);box-shadow:0 0 0 4px #f565121a}
button{width:100%;border:0;border-radius:11px;background:var(--orange);color:#fff;font:inherit;font-weight:800;padding:14px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.msg{min-height:22px;margin:13px 0 0;font-size:13px;color:#b42318;line-height:1.6}
.workspace{display:none;text-align:center}
.workspace.show{display:block}
.login.hide{display:none}
.ok{color:#16803d;font-weight:700}
.logout{background:#222}
.foot{text-align:center;color:#ffffffa8;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
 <div class="brand"><div class="mark">T</div><div><strong>TukTak24</strong><small>ব্যবসার হিসাব ব্যবস্থাপনা</small></div></div>
 <section class="login" id="loginView">
  <h1>অ্যাডমিন লগইন</h1>
  <p class="sub">আপনার অ্যাকাউন্টের পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>
  <form id="loginForm">
   <label for="password">পাসওয়ার্ড</label>
   <input id="password" type="password" placeholder="পাসওয়ার্ড লিখুন" autocomplete="current-password" required>
   <button id="loginButton" type="submit">লগইন করুন</button>
  </form>
  <p class="msg" id="loginMsg" role="status"></p>
 </section>
 <section class="workspace" id="workspace">
  <h1>লগইন সফল হয়েছে</h1>
  <p class="sub">হিসাব ব্যবস্থাপনার প্যানেল এখানে তৈরি করা হবে।</p>
  <p class="ok">আপনি নিরাপদে লগইন করেছেন।</p>
  <button class="logout" id="logoutButton" type="button">লগআউট</button>
 </section>
</main>
<div class="foot">শুধুমাত্র অনুমোদিত অ্যাডমিনের জন্য</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://glzvbzcwdhwopfeosbyx.supabase.co";
const SUPABASE_KEY="sb_publishable_Azha7bS6WLRf13CcXIpDBw_rBNEgnVY";
const ADMIN_EMAIL="tuktak24.1@gmail.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const loginView=document.getElementById("loginView");
const workspace=document.getElementById("workspace");
const msg=document.getElementById("loginMsg");
function showWorkspace(){loginView.classList.add("hide");workspace.classList.add("show");}
function showLogin(){workspace.classList.remove("show");loginView.classList.remove("hide");}
async function checkSession(){
 const {data}=await sb.auth.getSession();
 const user=data?.session?.user;
 if(user?.email?.toLowerCase()===ADMIN_EMAIL){showWorkspace();}
 else if(user){await sb.auth.signOut();showLogin();}
}
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value;
 const button=document.getElementById("loginButton");
 if(!password){msg.textContent="পাসওয়ার্ড লিখুন।";return;}
 button.disabled=true;msg.textContent="লগইন হচ্ছে…";
 const {data,error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password});
 button.disabled=false;
 if(error){msg.textContent="পাসওয়ার্ড সঠিক নয় অথবা লগইন করা যায়নি।";return;}
 if(data.user?.email?.toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut();msg.textContent="এই অ্যাকাউন্টের অনুমতি নেই।";return;}
 document.getElementById("password").value="";
 showWorkspace();
});
document.getElementById("logoutButton").addEventListener("click",async()=>{
 await sb.auth.signOut();showLogin();msg.textContent="লগআউট হয়েছে।";
});
checkSession();
</script>
</body>
</html>
